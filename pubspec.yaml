name: sports_groups_app
description: App para grupos de amigos y equipos deportivos
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.3
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.0.4
  cloud_functions: 5.6.2
  # Auth
  google_sign_in: ^6.2.1
  # Navigation
  go_router: ^14.2.7
  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # Fonts
  google_fonts: ^6.2.1
  # UI & Images
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  app_links: ^6.3.2
  # Notifications
  flutter_local_notifications: ^17.2.3
  # Utils
  intl: ^0.20.2
  uuid: ^4.4.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0
  mocktail: ^1.0.3
  fake_cloud_firestore: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/logo/
    